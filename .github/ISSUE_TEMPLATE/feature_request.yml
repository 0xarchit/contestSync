name: Feature Request
description: Suggest an idea for ContestSync
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make ContestSync even better? We'd love to hear it!
  - type: textarea
    id: feature-description
    attributes:
      label: Describe the feature
      description: What should the feature do?
      placeholder: I want ContestSync to...
    validations:
      required: true
  - type: textarea
    id: problem-solved
    attributes:
      label: What problem does this solve?
      description: Explain the use case or pain point this feature addresses.
  - type: textarea
    id: alternatives
    attributes:
      label: Any alternatives considered?
      description: Have you considered other ways to achieve this?

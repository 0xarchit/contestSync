<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="google-site-verification" content="RPixmM9Umri4goWpBuXjUznBBT0Ryuo7jyMziFp67yg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preferences - ContestSync</title>
    <link rel="icon" type="image/webp" href="icon.webp" />
    <meta
      name="description"
      content="Manage your ContestSync platform selections, dedicated calendar preferences, and account synchronization settings."
    />
    <meta
      name="keywords"
      content="contest sync preferences, calendar configuration, platform settings"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="https://unpkg.com/lenis@1.1.14/dist/lenis.min.js"></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="noise-overlay"></div>
    <div class="pref-container">
      <div class="pref-card">
        <div id="user-email" class="user-email"></div>
        <h1>Choose your platforms</h1>
        <p>We'll sync contests from these to your Google Calendar.</p>
        <form id="pref-form">
          <div id="platforms-list" class="platforms-list">
            <div class="loading-state">Loading platforms...</div>
          </div>
          <div
            class="dedicated-option"
            style="
              margin-top: 1.5rem;
              display: flex;
              align-items: center;
              gap: 0.75rem;
            "
          >
            <label class="platform-item" style="width: 100%">
              <input type="checkbox" id="use-dedicated" />
              <span class="custom-checkbox"></span>
              <span style="font-size: 0.9rem; color: var(--text-primary)"
                >Sync to a dedicated "ContestSync" calendar</span
              >
            </label>
          </div>
          <button
            type="submit"
            class="btn btn-primary"
            style="width: 100%; justify-content: center; margin-top: 1.5rem"
          >
            Start Sync
          </button>
        </form>
      </div>
    </div>
  </body>
</html>
